[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "orquestrador"
version = "0.1.0"
description = "Orquestrador multi-agente de testes de API para a skill qa-api."
requires-python = ">=3.12"

# Versões congeladas a partir do ambiente que funciona. Esta fase não é para
# atualizar dependência: as transitivas estão pinadas junto de propósito, para
# `pip install -e .` reproduzir exatamente o ambiente validado.
dependencies = [
  # Diretas
  "langgraph==1.2.10",
  "langchain-core==1.5.3",
  "langchain-openai==1.4.2",
  "pydantic==2.13.4",
  "python-dotenv==1.2.2",
  "rich==15.0.0",
  # Transitivas
  "annotated-types==0.8.0",
  "anyio==4.14.2",
  "certifi==2026.7.22",
  "charset-normalizer==3.4.9",
  "colorama==0.4.6",
  "distro==1.9.0",
  "h11==0.16.0",
  "httpcore==1.0.9",
  "httpx==0.28.1",
  "idna==3.18",
  "jiter==0.16.0",
  "jsonpatch==1.33",
  "jsonpointer==3.1.1",
  "langchain-protocol==0.0.18",
  "langgraph-checkpoint==4.1.1",
  "langgraph-prebuilt==1.1.0",
  "langgraph-sdk==0.4.2",
  "langsmith==0.10.16",
  "markdown-it-py==4.2.0",
  "mdurl==0.1.2",
  "openai==2.53.0",
  "orjson==3.11.9",
  "ormsgpack==1.12.2",
  "packaging==26.3",
  "pydantic-core==2.46.4",
  "Pygments==2.20.0",
  "PyYAML==6.0.3",
  "regex==2026.7.19",
  "requests==2.34.2",
  "requests-toolbelt==1.0.0",
  "sniffio==1.3.1",
  "tenacity==9.1.4",
  "tiktoken==0.13.0",
  "tqdm==4.70.0",
  "typing-inspection==0.4.2",
  "typing_extensions==4.16.0",
  "urllib3==2.7.0",
  "uuid_utils==0.17.0",
  "websockets==15.0.1",
  "xxhash==3.8.1",
  "zstandard==0.25.0",
]

[project.optional-dependencies]
dev = [
  "pytest==9.1.1",
  "iniconfig==2.3.0",
  "pluggy==1.6.0",
]

[project.scripts]
orquestrador = "orquestrador.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

# `prompts/`, `fixtures/` e `config.toml` ficam FORA do pacote de propósito:
# são conteúdo e dados do projeto, iterados por quem não mexe em código.

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
  # langgraph.prebuilt.create_react_agent segue disponível até a v2.0 do LangGraph.
  # O sucessor é langchain.agents.create_agent (pacote `langchain`, não instalado
  # aqui). Ver a nota em orquestrador/agentes/mapeador.py::_criar_agente.
  "ignore::DeprecationWarning:orquestrador.agentes.mapeador",
]
