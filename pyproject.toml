[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "orquestrador"
version = "0.1.0"
description = "Orquestrador multi-agente de testes de API para a skill qa-api."
requires-python = ">=3.12"

# Versões congeladas a partir do ambiente que funciona. Esta fase não é para
# atualizar dependência: as transitivas estão pinadas junto de propósito, para
# `pip install -e .` reproduzir exatamente o ambiente validado.
dependencies = [
  # Diretas
  "langgraph==1.2.10",
  "langchain-core==1.5.3",
  "langchain-openai==1.4.2",
  "pydantic==2.13.4",
  "python-dotenv==1.2.2",
  "rich==15.0.0",
  # Transitivas
  "annotated-types==0.8.0",
  "anyio==4.14.2",
  "certifi==2026.7.22",
  "charset-normalizer==3.4.9",
  "colorama==0.4.6",
  "distro==1.9.0",
  "h11==0.16.0",
  "httpcore==1.0.9",
  "httpx==0.28.1",
  "idna==3.18",
  "jiter==0.16.0",
  "jsonpatch==1.33",
  "jsonpointer==3.1.1",
  "langchain-protocol==0.0.18",
  "langgraph-checkpoint==4.1.1",
  "langgraph-prebuilt==1.1.0",
  "langgraph-sdk==0.4.2",
  "langsmith==0.10.16",
  "markdown-it-py==4.2.0",
  "mdurl==0.1.2",
  "openai==2.53.0",
  "orjson==3.11.9",
  "ormsgpack==1.12.2",
  "packaging==26.3",
  "pydantic-core==2.46.4",
  "Pygments==2.20.0",
  "PyYAML==6.0.3",
  "regex==2026.7.19",
  "requests==2.34.2",
  "requests-toolbelt==1.0.0",
  "sniffio==1.3.1",
  "tenacity==9.1.4",
  "tiktoken==0.13.0",
  "tqdm==4.70.0",
  "typing-inspection==0.4.2",
  "typing_extensions==4.16.0",
  "urllib3==2.7.0",
  "uuid_utils==0.17.0",
  "websockets==15.0.1",
  "xxhash==3.8.1",
  "zstandard==0.25.0",
]

[project.optional-dependencies]
dev = [
  "pytest==9.1.1",
  "iniconfig==2.3.0",
  "pluggy==1.6.0",
  # Ferramental da Etapa 3. Mesma política das dependências de runtime: versão
  # exata, transitivas pinadas junto, para o ambiente de todo mundo (e o da CI)
  # ser o mesmo que foi validado aqui.
  "ruff==0.16.2",
  "pyright==1.1.411",
  "pytest-cov==7.1.0",
  # Transitivas do bloco acima
  "coverage==7.15.4",  # de pytest-cov
  "nodeenv==1.10.0",   # de pyright: é ele que baixa o Node do binário do Pyright
]

[project.scripts]
orquestrador = "orquestrador.cli.principal:main"

# Empacotamento
# -------------
# O wheel precisa conter tudo que a execução procura. Antes ele não continha: um
# `pip install` do wheel instalava com sucesso e falhava no primeiro comando,
# porque `prompts/` ficava de fora e era procurado na árvore de fontes.
#
# `prompts/` continua morando na RAIZ do repositório, fora de `src/`, porque é
# conteúdo editorial iterado por quem não mexe em Python (AGENTS.md). O que muda é
# só o empacotamento: `package-dir` mapeia aquele diretório para o pacote
# `orquestrador.prompts`, e o build grava seu conteúdo no wheel em
# `orquestrador/prompts/`. Não há segunda cópia versionada para divergir — num
# checkout só existe `prompts/`; num ambiente instalado só existe
# `orquestrador/prompts/`. Quem resolve o caminho em tempo de execução é
# `raiz.py`, por `importlib.resources`.
#
# `fixtures/` e `config.toml` ficam FORA do wheel de propósito: o primeiro é dado
# de desenvolvimento do `--dry-run`, o segundo é do usuário e nasce de
# `orquestrador init`.
#
# A lista de pacotes é explícita, e não `packages.find`, porque `package-dir` com
# entrada fora da raiz não é visível para a descoberta automática — ela varre
# `where` e nunca acharia `prompts/`. O custo é uma lista que precisa acompanhar os
# subpacotes reais, e `tests/test_invariante_empacotamento.py` é quem cobra isso: subpacote
# novo em `src/orquestrador/` que não apareça aqui reprova, em vez de sumir do
# wheel em silêncio.
[tool.setuptools]
package-dir = { "" = "src", "orquestrador.prompts" = "prompts" }
packages = [
  "orquestrador",
  "orquestrador.agentes",
  "orquestrador.analise_estatica",
  "orquestrador.aplicacao",
  "orquestrador.cli",
  "orquestrador.dominio",
  "orquestrador.ferramentas",
  "orquestrador.gates",
  "orquestrador.llm",
  "orquestrador.observabilidade",
  "orquestrador.prompts",
]

[tool.setuptools.package-data]
"orquestrador.prompts" = ["*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# `--strict-markers`: marker escrito errado vira erro, não silêncio. Sem isso um
# `@pytest.mark.integracao` (em vez de `integration`) simplesmente não seleciona
# nada, e o filtro da CI passa a rodar zero teste sem reclamar.
#
# `--cov` NÃO entra aqui de propósito: o piso de cobertura é global e a suíte é
# rodada em fatias o tempo todo durante o desenvolvimento (`pytest tests/x.py`).
# Um piso no addopts faria toda execução parcial falhar por motivo alheio ao que
# se está testando. O `--cov` fica na linha de comando da CI, onde a suíte é
# sempre inteira.
addopts = "-q --strict-markers"
filterwarnings = [
  # langgraph.prebuilt.create_react_agent segue disponível até a v2.0 do LangGraph.
  # O sucessor é langchain.agents.create_agent (pacote `langchain`, não instalado
  # aqui). Ver a nota em orquestrador/agentes/grafo_react.py::criar_agente.
  #
  # O alvo é `grafo_react` e não `mapeador` porque todo o acoplamento com o
  # LangGraph mora naquele arquivo: silenciar o mapeador inteiro apagaria também
  # qualquer DeprecationWarning novo que aparecesse ali por outro motivo.
  "ignore::DeprecationWarning:orquestrador.agentes.grafo_react",
]
# O marker responde **"do que este teste precisa além do venv?"**, e não "quantos
# syscalls ele faz". A pergunta importa porque é a ausência de uma dependência de
# máquina que faz um teste pular sozinho, e é o pulo silencioso que
# `.github/scripts/checar_pulos.py` existe para caçar.
#
# Por isso `tmp_path` e `sys.executable` ficam em `unit`, por mais contraintuitivo
# que soe: disco temporário e o próprio interpretador vêm com o pytest. Classificar
# por mecanismo em vez de por dependência jogaria 15 dos 26 arquivos em
# `integration`, e o conjunto deixaria de significar "precisa de máquina preparada".
#
# Todo teste declara exatamente um destes. Quem cobra é o hook
# `pytest_collection_modifyitems` de `tests/conftest.py`.
markers = [
  "unit: roda com o venv e nada mais. `tmp_path` e `sys.executable` são permitidos — o disco temporário é do pytest e o interpretador é o nosso.",
  "integration: precisa de algo que o `pip install -e \".[dev]\"` não instala — Node, os scripts .mjs da skill, o uv, um executável de terceiro no PATH. Pula sozinho quando a dependência falta.",
  "e2e: o pipeline inteiro, de `main()` ao artefato em disco, com gates reais. Hoje é o --dry-run.",
]

# ---------------------------------------------------------------------------
# Ruff
# ---------------------------------------------------------------------------

[tool.ruff]
target-version = "py313"
line-length = 100
# `src` faz o isort (regras `I`) reconhecer `orquestrador` e os módulos de teste
# como primeira-parte, em vez de jogá-los no bloco de terceiros.
src = ["src", "tests"]

[tool.ruff.lint]
select = [
  "E4",      # pycodestyle: imports
  "E7",      # pycodestyle: statements
  "E9",      # pycodestyle: erro de sintaxe / IO
  "F",       # pyflakes
  "I",       # isort
  "UP",      # pyupgrade
  "B",       # flake8-bugbear
  "C4",      # flake8-comprehensions
  "PIE",     # flake8-pie
  "RUF",     # regras do próprio Ruff
  "S",       # flake8-bandit — subprocesso e caminho são o coração deste projeto
  "PTH",     # flake8-use-pathlib
  "ARG",     # flake8-unused-arguments
  "TID252",  # import relativo
  "PLC0415", # import fora do topo do arquivo
]

# RUF001/002/003 marcam caractere "confundível" com ASCII. O valor real da regra é
# pegar homoglifo e caractere invisível — NBSP, largura zero, cirílico disfarçado de
# latino —, e isso continua ligado. O que se libera aqui são dois símbolos
# matemáticos usados como matemática, não como letra:
#
#   × (U+00D7) — produto cartesiano na prosa: "endpoint × categoria",
#     "diff grafo × manifesto", "x64 × arm64". Trocar por `x` viraria "endpoint x
#     categoria", que lê como variável, não como cruzamento.
#   ∪ (U+222A) — união de conjuntos em contratos.py: "`cats` ∪ `naoAplica`".
#     O `U` maiúsculo que o Ruff sugere não é o operador.
#
# Um inventário de todos os não-ASCII do repositório (acentuação portuguesa, —, …,
# →, ✓) não achou nenhum caractere invisível ou acidental: a tipografia é toda
# deliberada. Por isso a liberação é nominal, e não `RUF001` desligada por inteiro.
allowed-confusables = ["×", "∪"]

# Regras deliberadamente FORA do `select`, com o porquê. Sem isto, a próxima
# pessoa (ou o próximo agente) "conserta" a configuração ligando-as de novo.
#
# N818 — exige que toda exceção termine em `Error`. Quebraria a taxonomia
#   `ErroDe...` / `FalhaDe...` de excecoes.py, que é deliberada e em português.
#   O sufixo carrega significado aqui: `FalhaDe*` é reprovação prevista do
#   pipeline, `ErroDe*` é defeito de configuração ou de invocação.
#
# D101 / D103 — docstring obrigatória em classe e função pública. Com IA
#   escrevendo o código, o resultado não é documentação: é uma linha que repete
#   o nome da função e envelhece sem ninguém notar.
#
# N815 (mixedCase em atributo de classe) sobre os modelos que espelham JSON
#   externo — `naoAplica`, `schemaEntrada` e afins são o contrato da skill
#   `qa-api`, definido por ela, não desleixo de nomenclatura nosso. Renomear
#   quebraria a serialização; um `noqa` por campo seria pior que a regra.
#
# C901 / PLR0912 / PLR0915 (complexidade) e qualquer limite automático de
#   linhas — dividiriam `config.py` e `ferramentas/arquivos.py`, que são coesos.
#   Módulo grande e coeso é melhor que cinco módulos que só existem para caber
#   num número. Quem julga isso é revisão, não contador.

[tool.ruff.lint.per-file-ignores]
# S101 é `assert`, que é justamente como o pytest afirma. Só ele: o resto do
# flake8-bandit continua valendo em tests/ — teste também abre subprocesso e
# monta caminho, e é ali que mora metade do risco deste projeto.
#
# ARG001/ARG002/ARG005 (argumento, método e lambda não usados) porque em pytest
# "não usar o valor" é o caso normal, não descuido:
#
#   * fixture pedida pelo efeito colateral — `ambiente_sujo` suja o ambiente,
#     `recurso` cria o diretório, `monkeypatch` já aplicou o patch no setup. O
#     valor devolvido não interessa; a requisição é que faz o trabalho. Remover o
#     parâmetro não "limpa" nada: desliga a fixture e quebra o teste.
#   * duplo de teste que precisa espelhar a assinatura real — `CoberturaFalsa
#     .executar(self, _dir, *, report=None, out=None)` só é substituível porque
#     aceita `out=`, que a produção passa em pipeline.py e gates/gate_b.py.
#     Renomear para `_out` faria o duplo parar de casar com a chamada real.
#   * lambda de aridade fixa passada como callback (`lambda numero, delta, atual:
#     ...`), onde o teste só se importa com um dos três.
#
# Isto vale só em tests/**: em src/ as três regras continuam ligadas.
"tests/**" = ["S101", "ARG001", "ARG002", "ARG005"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.format]
# LF no repositório inteiro, inclusive no Windows. Ver .gitattributes.
line-ending = "lf"

# ---------------------------------------------------------------------------
# Pyright
# ---------------------------------------------------------------------------

[tool.pyright]
include = ["src", "tests"]
exclude = [".venv", ".execucoes", "**/__pycache__"]
# Sem estas duas linhas o Pyright resolve os imports pelo Python do PATH, não pelo
# do projeto, e todo pacote instalado só no ambiente virtual — pytest, langgraph,
# langchain_core — vira `could not be resolved`. O efeito não é só ruído de import:
# sem os stubs desses pacotes, tudo que vem deles é `Unknown`, e o modo `strict` de
# `src` transforma cada uso em erro. É a diferença entre 362 e 90 erros.
venvPath = "."
venv = ".venv"
pythonVersion = "3.13"
pythonPlatform = "Windows"
# `standard` no repositório todo e `strict` só em `src`: teste pode usar um
# duplo de teste meia-boca sem virar dívida de tipagem; código de produção, não.
typeCheckingMode = "standard"
strict = ["src"]
# Sem baseline de ignores: um `# type: ignore` que deixou de ser necessário é
# erro. É o que impede a lista de silenciamentos de crescer para sempre.
reportUnnecessaryTypeIgnoreComment = "error"

# ---------------------------------------------------------------------------
# Coverage
# ---------------------------------------------------------------------------

[tool.coverage.run]
# Branch coverage: sem ela, um `if` cujo ramo falso nunca roda conta como
# coberto. Neste projeto os ramos falsos são justamente os caminhos de
# reprovação de gate — o que mais importa medir.
branch = true
# `source_pkgs` (não `source`) porque o pacote é instalado em modo editável a
# partir de `src/`: medir pelo nome do pacote acha o código onde quer que o
# `pip install -e` o tenha deixado.
source_pkgs = ["orquestrador"]

[tool.coverage.report]
# 85 com 86% medido hoje: piso é rede de segurança contra regressão, não meta.
# Colar o piso no valor atual transforma qualquer refatoração em falha de CI.
fail_under = 85
precision = 1
show_missing = true
skip_covered = true
