# O contrato com a skill `qa-api` — só sob demanda.
#
# Workflow separado, e não um job condicional dentro do `ci.yml`, por um motivo
# visível: um job com `if:` falso ainda aparece na lista da execução, como
# `skipped` ao lado dos verdes. Era exatamente esse o defeito que estamos
# corrigindo — "a CI está passando" passava a significar algo diferente do que
# parecia. Aqui ele simplesmente não aparece, a menos que alguém o dispare.
#
# Por que ele não roda sozinho: a skill mora fora deste repositório e não há cópia
# que o runner alcance. O contrato é verificado na máquina de quem desenvolve, com
# `pytest -m "integration or e2e" -rs`. Ver o ADR 0014 e a seção "Como verificar"
# do AGENTS.md.
#
# PARA LIGAR (o gatilho para rever o ADR 0014): publique a skill num repositório e
# defina, nas configurações deste:
#   - variable  SKILL_REPO   ex.: "minha-org/qa-agent-skills"
#   - variable  SKILL_REF    (opcional) tag/branch; padrão "main"
#   - secret    SKILL_TOKEN  se o repositório da skill for privado
# Depois acrescente `push:` e `pull_request:` ao `on:` abaixo.

name: Contrato com a skill qa-api

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: "utf-8"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  integracao:
    name: Integração (Node 24 + skill qa-api)
    runs-on: windows-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4
        with:
          path: orquestrador

      - name: Checkout da skill qa-api (repositório externo)
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.SKILL_REPO }}
          ref: ${{ vars.SKILL_REF || 'main' }}
          token: ${{ secrets.SKILL_TOKEN || github.token }}
          path: skill

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: orquestrador/pyproject.toml

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Conferir a versão do Node
        # A skill exige Node 24. Se o runner entregar outra coisa, é melhor
        # descobrir aqui do que num `.mjs` falhando com erro de sintaxe.
        shell: bash
        run: |
          node --version
          case "$(node --version)" in
            v24.*) ;;
            *) echo "::error::Esperado Node 24, veio $(node --version)"; exit 1 ;;
          esac

      - name: Instalar o projeto e o ferramental
        working-directory: orquestrador
        run: python -m pip install -e ".[dev]"

      - name: Apontar [caminhos].skill para a cópia baixada
        # Mutação só no runner, nunca no repositório: o config.toml versionado
        # tem o caminho absoluto da máquina de desenvolvimento, que não existe
        # aqui. Os testes de integração leem `[caminhos].skill` deste arquivo
        # para decidir se pulam (tests/test_e2e_dry_run.py::_skill_configurada).
        shell: bash
        working-directory: orquestrador
        run: |
          python - <<'PY'
          import pathlib, re
          alvo = pathlib.Path("config.toml")
          texto = alvo.read_text(encoding="utf-8")
          skill = pathlib.Path("../skill").resolve().as_posix()
          novo, n = re.subn(
              r'(?m)^skill\s*=\s*".*"$', f'skill = "{skill}"', texto, count=1
          )
          if n != 1:
              raise SystemExit("não achei a linha `skill = \"...\"` no config.toml")
          alvo.write_text(novo, encoding="utf-8")
          print(f"skill -> {skill}")
          PY
          test -f ../skill/scripts/validar-suite-gerada.mjs \
            || { echo "::error::skill sem scripts/validar-suite-gerada.mjs"; exit 1; }

      - name: Instalar o uv
        # `test_wheel_limpo` constrói o wheel e o instala num ambiente vazio, e
        # pula sozinho sem o `uv`. Aqui pulo é anomalia — é o que o passo final
        # cobra —, então o `uv` deixa de ser opcional neste job.
        run: python -m pip install uv

      - name: Testes de integração e ponta a ponta
        working-directory: orquestrador
        # `-rs` lista o motivo de cada pulo no log — é o que se lê quando o
        # passo seguinte reprova.
        #
        # Seleção por marker, e não por caminho de arquivo: renomear um arquivo
        # de teste passaria a esvaziar a seleção em silêncio. `e2e` entra junto
        # porque é ele que precisa do Node e dos `.mjs`; `integration` sozinho
        # traria só o teste do wheel.
        run: python -m pytest -m "integration or e2e" -rs --junitxml=junit-integracao.xml

      - name: Nenhum teste de integração pode ter sido pulado
        if: always()
        working-directory: orquestrador
        # O ponto do job inteiro. Os testes de integração pulam sozinhos quando
        # o Node ou a skill não estão disponíveis — comportamento correto na
        # máquina de quem desenvolve, e desastroso aqui: um job verde que não
        # executou nada é a forma mais cara de não ter cobertura de integração.
        # Este job existe justamente para garantir as duas dependências, então
        # qualquer pulo é anomalia.
        run: python .github/scripts/checar_pulos.py junit-integracao.xml
