# CI do orquestrador.
#
# Duas decisões que valem explicação:
#
# 1. `windows-latest` e nada mais. Este projeto conversa com o sistema de
#    arquivos e com subprocessos o tempo todo (confinamento de caminho,
#    invocação de executável, comparação de caminho sem diferenciar caixa). É
#    justamente onde Windows e Linux divergem. Rodar em Ubuntu daria um verde
#    que não diz nada sobre a máquina de quem usa isto.
#
# 2. Python 3.13 apenas. A revisão sugeriu 3.12 + 3.13; não há usuário em 3.12,
#    e a matriz dobraria o tempo sem retorno. Reavaliar se aparecer demanda.

name: CI

on:
  push:
    branches: ["main", "melhorias/**"]
  pull_request:
  workflow_dispatch:

# Push novo na mesma branch cancela a execução anterior: ninguém lê o resultado
# de um commit que já foi substituído.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # O console do Windows não é UTF-8 por padrão, e este projeto é todo em
  # português. Sem isto, acento em mensagem de teste vira UnicodeEncodeError na
  # CI e em nenhuma outra máquina.
  PYTHONUTF8: "1"
  PYTHONIOENCODING: "utf-8"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  # ---------------------------------------------------------------------------
  lint-e-tipo:
    name: Lint e tipagem
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Instalar o projeto e o ferramental
        run: python -m pip install -e ".[dev]"

      - name: Ruff — lint
        run: ruff check --output-format=github .

      - name: Ruff — formatação
        # `--check` só confere; quem corrige é o pre-commit na máquina de quem
        # escreve. A CI nunca reescreve código.
        run: ruff format --check --diff .

      - name: Pyright
        # `standard` no repositório, `strict` em `src` — a configuração está em
        # [tool.pyright] no pyproject.toml, não aqui.
        run: pyright

  # ---------------------------------------------------------------------------
  testes:
    name: Testes e cobertura
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Instalar o projeto e o ferramental
        run: python -m pip install -e ".[dev]"

      - name: Suíte com cobertura
        # `--cov` sem valor usa `source_pkgs` de [tool.coverage.run]. O piso
        # (`fail_under = 85`) também vem do pyproject: fonte única. Ele fica
        # FORA do `addopts` do pytest de propósito — quem roda a suíte em fatias
        # durante o desenvolvimento não pode ser reprovado por cobertura global.
        # Aqui a suíte é sempre inteira, então o piso vale.
        run: python -m pytest --cov --cov-report=term-missing --cov-report=xml

      - name: Guardar o relatório de cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cobertura
          path: coverage.xml
          if-no-files-found: warn

  # ---------------------------------------------------------------------------
  integracao:
    name: Integração e ponta a ponta
    runs-on: windows-latest
    timeout-minutes: 25

    # Job próprio, e não um passo do `testes`, por causa do passo final: o
    # `checar_pulos` reprova QUALQUER pulo, e a suíte completa tem um pulo
    # legítimo (a isenção de checagem de crase em `test_invariante_documentacao`).
    # Misturar os dois faria a única checagem que enxerga "verde sem executar
    # nada" reprovar por um motivo que não é o dela.
    #
    # Estes testes rodavam num workflow à parte, disparado só à mão, porque
    # precisavam de Node e de um checkout da skill `qa-api` que o runner não
    # alcançava (ADR 0014). Nenhuma das duas coisas é verdade desde o
    # desacoplamento — sobrou o `uv`, que se instala com pip.

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Instalar o projeto e o ferramental
        run: python -m pip install -e ".[dev]"

      - name: Instalar o uv
        # `test_wheel_limpo` constrói o wheel e o instala num ambiente vazio, e
        # pula sozinho sem o `uv`. Aqui pulo é anomalia — é o que o passo final
        # cobra —, então o `uv` deixa de ser opcional.
        run: python -m pip install uv

      - name: Testes de integração e ponta a ponta
        # Seleção por marker, e não por caminho de arquivo: renomear um arquivo
        # de teste passaria a esvaziar a seleção em silêncio.
        run: python -m pytest -m "integration or e2e" -rs --junitxml=junit-integracao.xml

      - name: Nenhum teste pode ter sido pulado
        if: always()
        run: python .github/scripts/checar_pulos.py junit-integracao.xml

  # ---------------------------------------------------------------------------
  docs:
    name: Site de documentação
    runs-on: windows-latest
    timeout-minutes: 10

    # O site NÃO é publicado (ADR 0011). Este job existe pelo `--strict`, que
    # transforma link quebrado e página fora da navegação em erro — as duas falhas
    # que um `mkdocs build` normal só avisa, e que ninguém lê num log verde.
    #
    # O resultado é descartado. Não há `upload-artifact` nem deploy: publicar
    # tornaria público o conteúdo do repositório, e essa decisão é do dono.

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Instalar o extra de documentação
        # Só `[docs]`, e não `[dev]`: este job não roda teste, e instalar as duas
        # coisas dobraria o tempo por nada.
        run: python -m pip install -e ".[docs]"

      - name: Construir o site em modo estrito
        run: python -m mkdocs build --strict
