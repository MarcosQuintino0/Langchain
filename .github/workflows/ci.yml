# CI do orquestrador.
#
# Duas decisões que valem explicação:
#
# 1. `windows-latest` e nada mais. Este projeto conversa com o sistema de
#    arquivos e com subprocessos o tempo todo (confinamento de caminho,
#    `node ... .mjs`, comparação de caminho sem diferenciar caixa). É
#    justamente onde Windows e Linux divergem. Rodar em Ubuntu daria um verde
#    que não diz nada sobre a máquina de quem usa isto.
#
# 2. Python 3.13 apenas. A revisão sugeriu 3.12 + 3.13; não há usuário em 3.12,
#    e a matriz dobraria o tempo sem retorno. Reavaliar se aparecer demanda.

name: CI

on:
  push:
    branches: ["main", "melhorias/**"]
  pull_request:
  workflow_dispatch:

# Push novo na mesma branch cancela a execução anterior: ninguém lê o resultado
# de um commit que já foi substituído.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # O console do Windows não é UTF-8 por padrão, e este projeto é todo em
  # português. Sem isto, acento em mensagem de teste vira UnicodeEncodeError na
  # CI e em nenhuma outra máquina.
  PYTHONUTF8: "1"
  PYTHONIOENCODING: "utf-8"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  # ---------------------------------------------------------------------------
  lint-e-tipo:
    name: Lint e tipagem
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Instalar o projeto e o ferramental
        run: python -m pip install -e ".[dev]"

      - name: Ruff — lint
        run: ruff check --output-format=github .

      - name: Ruff — formatação
        # `--check` só confere; quem corrige é o pre-commit na máquina de quem
        # escreve. A CI nunca reescreve código.
        run: ruff format --check --diff .

      - name: Pyright
        # `standard` no repositório, `strict` em `src` — a configuração está em
        # [tool.pyright] no pyproject.toml, não aqui.
        run: pyright

  # ---------------------------------------------------------------------------
  testes:
    name: Testes e cobertura
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Instalar o projeto e o ferramental
        run: python -m pip install -e ".[dev]"

      - name: Suíte com cobertura
        # `--cov` sem valor usa `source_pkgs` de [tool.coverage.run]. O piso
        # (`fail_under = 85`) também vem do pyproject: fonte única. Ele fica
        # FORA do `addopts` do pytest de propósito — quem roda a suíte em fatias
        # durante o desenvolvimento não pode ser reprovado por cobertura global.
        # Aqui a suíte é sempre inteira, então o piso vale.
        run: python -m pytest --cov --cov-report=term-missing --cov-report=xml

      - name: Guardar o relatório de cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cobertura
          path: coverage.xml
          if-no-files-found: warn

  # ---------------------------------------------------------------------------
  integracao:
    name: Integração (Node 24 + skill qa-api)
    runs-on: windows-latest
    timeout-minutes: 25

    # ┌───────────────────────────────────────────────────────────────────────┐
    # │ ESTE JOB NÃO RODA A CADA PUSH — e isso está declarado, não escondido.  │
    # ├───────────────────────────────────────────────────────────────────────┤
    # │ Ele precisa da skill `qa-api`, que é OUTRO PROJETO e hoje só existe    │
    # │ na máquina de quem desenvolve. Não há repositório para a CI alcançar,  │
    # │ então o contrato com os `.mjs` é verificado localmente — ver a seção   │
    # │ "Como verificar" do AGENTS.md.                                         │
    # │                                                                       │
    # │ Antes, o job era condicionado a `vars.SKILL_REPO != ''`, uma variável  │
    # │ que nunca foi definida. O efeito era pior que não existir: o job       │
    # │ aparecia como `skipped` ao lado dos verdes, e "a CI está passando"     │
    # │ passou a significar algo diferente do que parecia. Um job que nunca    │
    # │ roda não deve ficar num gatilho automático.                           │
    # │                                                                       │
    # │ PARA LIGAR (o gatilho para rever o ADR 0014): publique a skill num     │
    # │ repositório, defina as variáveis abaixo e devolva `push` e             │
    # │ `pull_request` ao `on:` deste job.                                     │
    # │   - variable  SKILL_REPO   ex.: "minha-org/qa-agent-skills"           │
    # │   - variable  SKILL_REF    (opcional) tag/branch; padrão "main"       │
    # │   - secret    SKILL_TOKEN  se o repositório da skill for privado      │
    # │                                                                       │
    # │ Enquanto isso, `workflow_dispatch` permite rodá-lo à mão quando as     │
    # │ variáveis existirem. Sem elas, ele reprova em vez de fingir que passou.│
    # └───────────────────────────────────────────────────────────────────────┘
    if: ${{ github.event_name == 'workflow_dispatch' }}

    steps:
      - uses: actions/checkout@v4
        with:
          path: orquestrador

      - name: Checkout da skill qa-api (repositório externo)
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.SKILL_REPO }}
          ref: ${{ vars.SKILL_REF || 'main' }}
          token: ${{ secrets.SKILL_TOKEN || github.token }}
          path: skill

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: orquestrador/pyproject.toml

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Conferir a versão do Node
        # A skill exige Node 24. Se o runner entregar outra coisa, é melhor
        # descobrir aqui do que num `.mjs` falhando com erro de sintaxe.
        shell: bash
        run: |
          node --version
          case "$(node --version)" in
            v24.*) ;;
            *) echo "::error::Esperado Node 24, veio $(node --version)"; exit 1 ;;
          esac

      - name: Instalar o projeto e o ferramental
        working-directory: orquestrador
        run: python -m pip install -e ".[dev]"

      - name: Apontar [caminhos].skill para a cópia baixada
        # Mutação só no runner, nunca no repositório: o config.toml versionado
        # tem o caminho absoluto da máquina de desenvolvimento, que não existe
        # aqui. Os testes de integração leem `[caminhos].skill` deste arquivo
        # para decidir se pulam (tests/test_dry_run.py::_skill_configurada).
        shell: bash
        working-directory: orquestrador
        run: |
          python - <<'PY'
          import pathlib, re
          alvo = pathlib.Path("config.toml")
          texto = alvo.read_text(encoding="utf-8")
          skill = pathlib.Path("../skill").resolve().as_posix()
          novo, n = re.subn(
              r'(?m)^skill\s*=\s*".*"$', f'skill = "{skill}"', texto, count=1
          )
          if n != 1:
              raise SystemExit("não achei a linha `skill = \"...\"` no config.toml")
          alvo.write_text(novo, encoding="utf-8")
          print(f"skill -> {skill}")
          PY
          test -f ../skill/scripts/validar-suite-gerada.mjs \
            || { echo "::error::skill sem scripts/validar-suite-gerada.mjs"; exit 1; }

      - name: Instalar o uv
        # `test_wheel_limpo` constrói o wheel e o instala num ambiente vazio, e
        # pula sozinho sem o `uv`. Aqui pulo é anomalia — é o que o passo final
        # cobra —, então o `uv` deixa de ser opcional neste job.
        run: python -m pip install uv

      - name: Testes de integração e ponta a ponta
        working-directory: orquestrador
        # `-rs` lista o motivo de cada pulo no log — é o que se lê quando o
        # passo seguinte reprova.
        #
        # Seleção por marker, e não por caminho de arquivo: renomear um arquivo
        # de teste passaria a esvaziar a seleção em silêncio. `e2e` entra junto
        # porque é ele que precisa do Node e dos `.mjs`; `integration` sozinho
        # traria só o teste do wheel.
        run: python -m pytest -m "integration or e2e" -rs --junitxml=junit-integracao.xml

      - name: Nenhum teste de integração pode ter sido pulado
        if: always()
        working-directory: orquestrador
        # O ponto do job inteiro. Os testes de integração pulam sozinhos quando
        # o Node ou a skill não estão disponíveis — comportamento correto na
        # máquina de quem desenvolve, e desastroso aqui: um job verde que não
        # executou nada é a forma mais cara de não ter cobertura de integração.
        # Este job existe justamente para garantir as duas dependências, então
        # qualquer pulo é anomalia.
        run: python .github/scripts/checar_pulos.py junit-integracao.xml
