# Configuração do orquestrador.
#
# Caminhos relativos são resolvidos contra o diretório DESTE arquivo.
# Nenhum nome de modelo aparece no código: tudo vem daqui (princípio 6).

[caminhos]
# A skill `qa-api` mora em OUTRO projeto e é apenas consumida, nunca modificada.
# Caminho absoluto de propósito: os dois repositórios são independentes e não têm
# posição relativa garantida.
skill = "C:/Agents/skills/qa-api"
# scripts = ".../skills/qa-api/scripts"   # derivado de `skill` quando omitido

# AJUSTE OS DOIS ABAIXO antes de rodar sem --dry-run.
# O --dry-run ignora ambos e usa a sandbox de fixtures.
backend = "../Backend-"
projeto_testes = "../projeto-de-testes"

# Relativos ao projeto de testes.
dir_recursos = "cypress/e2e/apis"
graph = ".agents/state/qa-api/graphify-out/graph.json"

# Raiz dos schemas de entrada. O mapeador grava aqui, em <recurso>/<nome>.schema.json,
# e é daqui que o validador da skill tira o denominador da cobertura por campo.
dir_schemas = "cypress/fixtures/schemas"

# Módulos compartilhados (client, rotas, auth, asserts base, schema) que o executor
# importa. O Bloco 0 extrai deles a superfície — nomes de export, assinaturas
# verbatim e caminhos de import calculados — e a injeta na instrução do executor.
# PRÉ-CONDIÇÃO: este diretório precisa existir e ter exports. O orquestrador gera
# testes num projeto já preparado; preparar o projeto é outro fluxo da skill.
support_compartilhado = "cypress/support/api"

# Relativo a este diretório: logs, artefatos e sandbox de cada execução.
saida = ".execucoes"

# ---------------------------------------------------------------------------
# Compatibilidade com a skill
# ---------------------------------------------------------------------------
# A skill `qa-api` é outro repositório, e a integração com ela é um contrato
# IMPLÍCITO: formato dos argumentos, código de saída, forma do JSON e semântica
# dos códigos QAAPI-. Nada disso está declarado em lugar nenhum.
#
# Pior: os prompts em `prompts/` são condensação MANUAL das `references/*.md`
# dela. Se a skill mudar uma regra, nada avisa este orquestrador — são duas
# fontes de verdade, uma copiando a outra, sem detecção de divergência.
#
# A impressão é o hash do conteúdo dos `.mjs` que invocamos. Mudou, o pipeline
# recusa rodar e diz o hash novo, para você conferir o contrato antes de aceitar.
# É a mesma proteção que o `qa-reindex.mjs` faz com a versão do Graphify.
#
# Deixe vazio para desligar — é o certo para quem edita a skill e o consumidor
# ao mesmo tempo, onde o hash mudaria a cada salvamento.
[skill]
impressao_esperada = "6f004c54afd5b6e3"

[openrouter]
base_url = "https://openrouter.ai/api/v1"
api_key_env = "OPENROUTER_API_KEY"
# referer = "https://exemplo.interno/qa-api"
# titulo  = "orquestrador qa-api"
timeout_s = 180.0
max_retries = 2
# O cache de prefixo mora no provedor FINAL, e o OpenRouter escolhe provedor por
# requisição: sem fixar, cada volta do ReAct pode cair num provedor que nunca viu
# o prefixo. Medido em 2026-08: 0% de cache hit sem pin, 86–93% com pin — num loop
# de agente, onde toda volta reenvia o histórico, essa diferença é quase o custo do
# estágio. Lista vazia volta ao roteamento livre: mais resiliente a
# indisponibilidade, muito mais caro.
#
# Together serve o modelo em fp8 e tem a série de medidas mais longa aqui; Novita e
# AtlasCloud mediram equivalente (74% de cache real na mesma carga) e são as
# alternativas. Baidu e SiliconFlow anunciam preço de cache e não entregam;
# DeepInfra serve a variante quantizada fp4. Ao trocar de provedor ou de modelo,
# confira a coluna "do cache" do relatório: ela é que diz se o pin ainda paga.
provedores_permitidos = ["together"]

# ---------------------------------------------------------------------------
# Modelos por estágio
# ---------------------------------------------------------------------------
# O mapeador tem o julgamento mais difícil e o menor volume de saída: recebe o
# modelo mais capaz. O executor tem o volume de tokens e trabalho mecânico se o
# gabarito for bom: aceita um modelo mais barato, porque o Gate B pega os erros
# de forma determinística.
#
# `modo_estruturado`: "prompt" (mais portátil), "json_schema", "json_object" ou
# "tools". Em qualquer modo a saída é validada por Pydantic aqui; se não validar,
# um delta de estágio "schema" é reenviado sozinho.

[estagios.mapeador]
modelo = "deepseek/deepseek-v4-flash-0731"
temperatura = 0.0
modo_estruturado = "prompt"
max_tentativas_schema = 3
limite_passos = 60

[estagios.executor]
modelo = "deepseek/deepseek-v4-flash-0731"
temperatura = 0.0
modo_estruturado = "prompt"
max_tentativas_schema = 3

[estagios.auditor]
modelo = "deepseek/deepseek-v4-flash-0731"
temperatura = 0.0
modo_estruturado = "prompt"

# ---------------------------------------------------------------------------
# Gates
# ---------------------------------------------------------------------------

[gates.a]
# --so-manifesto é acrescentado de qualquer forma; --json também.
flags = ["--so-manifesto"]
max_tentativas = 3

[gates.b]
flags = ["--exigir-campos"]
max_tentativas = 3
# Reprova quando o gabarito declara uma categoria em `cats` e nenhum `it` a cobre —
# a lacuna que o qa-cobertura.mjs conta e o validar-suite-gerada.mjs não enxerga.
exigir_cobertura = true

# ---------------------------------------------------------------------------
# Execução
# ---------------------------------------------------------------------------

[execucao]
node = "node"
graphify = "graphify"
timeout_s = 600

# Prettier e ESLint do Gate B. Lista vazia desliga a etapa.
# Ligue apontando para o toolchain do projeto consumidor, por exemplo:
#   prettier = ["npx", "--no-install", "prettier", "--check"]
#   eslint   = ["npx", "--no-install", "eslint", "--format", "json"]
# O diretório do recurso é acrescentado como último argumento.
prettier = []
eslint = []
# Ferramenta configurada aqui e ausente do PATH:
#   true  interrompe a execução com erro de ferramenta;
#   false segue com o aviso QAORQ-022.
# Nem um nem outro reprova o artefato — instalar o toolchain do projeto não é
# trabalho que o executor consiga fazer reescrevendo teste.
exigir_formatadores = false

# Bloco 3. Só roda com --rodar-cypress.
#
# O comando PRECISA conter a marca {relatorio} no argumento que diz ao repórter
# onde escrever o JSON. O orquestrador a substitui pelo caminho do relatório desta
# execução (dentro de `saida`), garante que ele não existe antes de rodar e exige
# que exista depois. Sem isso não há como distinguir o relatório de agora do que
# uma execução anterior deixou no projeto — e relatório velho aprovando suíte nova
# é o falso sucesso mais silencioso que existe.
#
# Código de saída diferente de zero reprova o recurso; quando o Cypress não roda,
# o resumo diz NAO_EXECUTADO em vez de deixar a cobertura estática passar por prova.
#
#   cypress = ["npx", "--no-install", "cypress", "run",
#              "--reporter", "json", "--reporter-options", "output={relatorio}"]
cypress = []

max_bytes_arquivo = 2000000
max_resultados_busca = 40

# Teto desta bateria de teste. 8 milhões de tokens por execução: folga de ~6x sobre
# a faixa estimada para o backend inteiro, e um freio contra laço em fuga.
[orcamento.por_execucao]
tokens = 8000000
