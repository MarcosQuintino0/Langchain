# Configuração do orquestrador.
#
# Caminhos relativos são resolvidos contra o diretório DESTE arquivo.
# Nenhum nome de modelo aparece no código: tudo vem daqui (princípio 6).

[caminhos]
# AJUSTE OS DOIS ABAIXO antes de rodar sem --dry-run.
# O --dry-run ignora ambos e usa a sandbox de fixtures.
backend = "../Backend-"
projeto_testes = "../projeto-de-testes"

# Relativos ao projeto de testes.
dir_recursos = "cypress/e2e/apis"
graph = ".agents/state/qa-api/graphify-out/graph.json"

# Raiz dos schemas de entrada. O mapeador grava aqui, em <recurso>/<nome>.schema.json.
dir_schemas = "cypress/fixtures/schemas"

# Módulos compartilhados (client, rotas, auth, asserts base, schema) que o executor
# importa. O Bloco 0 extrai deles a superfície — nomes de export, assinaturas
# verbatim e caminhos de import calculados — e a injeta na instrução do executor.
# PRÉ-CONDIÇÃO: este diretório precisa existir e ter exports. O orquestrador gera
# testes num projeto já preparado; preparar o projeto ainda é passo manual
# (ver docs/arquitetura/pendencias.md).
support_compartilhado = "cypress/support/api"

# Relativo a este diretório: logs, artefatos e sandbox de cada execução.
saida = ".execucoes"

# O JSONL local é sempre a fonte primária. O pulso permite distinguir uma execução
# viva de uma que morreu sem evento terminal.
[observabilidade]
intervalo_pulso_s = 30.0

# Exportação opcional de traces e métricas sanitizadas via OTLP/HTTP. Desligada por
# padrão; falha do Collector nunca interrompe o pipeline. O valor de autenticação
# vem da variável indicada, nunca deste arquivo.
[observabilidade.otlp]
habilitado = false
endpoint = "http://localhost:4318"
timeout_s = 5.0
service_name = "orquestrador"
headers_env = "OTEL_EXPORTER_OTLP_HEADERS"
incluir_identificadores = false

[openrouter]
base_url = "https://openrouter.ai/api/v1"
api_key_env = "OPENROUTER_API_KEY"
# referer = "https://exemplo.interno/qa-api"
# titulo  = "orquestrador qa-api"
timeout_s = 180.0
max_retries = 2
# O cache de prefixo mora no provedor FINAL, e o OpenRouter escolhe provedor por
# requisição: sem fixar, cada volta do ReAct pode cair num provedor que nunca viu
# o prefixo. Medido em 2026-08: 0% de cache hit sem pin, 86–93% com pin — num loop
# de agente, onde toda volta reenvia o histórico, essa diferença é quase o custo do
# estágio. Lista vazia volta ao roteamento livre: mais resiliente a
# indisponibilidade, muito mais caro.
#
# Together serve o modelo em fp8 e tem a série de medidas mais longa aqui; Novita e
# AtlasCloud mediram equivalente (74% de cache real na mesma carga) e são as
# alternativas. Baidu e SiliconFlow anunciam preço de cache e não entregam;
# DeepInfra serve a variante quantizada fp4. Ao trocar de provedor ou de modelo,
# confira a coluna "do cache" do relatório: ela é que diz se o pin ainda paga.
#
# 2026-08-10: saiu da Together. O uptime dela caiu para 87,6% (uma requisição em
# oito) e seis execuções seguidas morreram em 429 do pool compartilhado — e cada
# falha do mapeador descarta a exploração inteira, medido em 134 mil tokens
# jogados fora numa execução só. Baidu entra com 43% de desconto na tabela
# ($0,0798/$0,1596), fp8 como a Together, 99,7% de uptime e cache anunciado a
# $0,016. **Medido em 2026-08-10 nesta carga: 69% de cache real no mapeador**, o
# que REVOGA o "não entregam" acima para o Baidu — a medição antiga é anterior ao
# desconto e ao endpoint atual. Alternativas se ele degradar: gmicloud (fp8,
# 99,9% de uptime); deepinfra é mais barata ainda, mas serve fp4.
#
# 2026-08-10, mais tarde: o pool compartilhado do Baidu fechou por
# `tpm_rate_limit_exceeded` — nem uma chamada mínima passava, e duas execuções da
# suíte morreram no mapeador. Isso é janela do provedor, não concorrência nossa:
# o mapeador roda com paralelismo 1. Acrescentar `deepinfra` como segundo nome
# foi tentado e desfeito, por duas razões que valem para qualquer futura
# tentativa de "só destravar": ele serve **fp4** contra o fp8 do Baidu, e o cache
# de prefixo mora no provedor final, então alternar entre dois desfaz parte dos
# 69% medidos. Com dois nomes na lista, tokens, custo e qualidade passam a
# depender de QUEM atendeu cada chamada — e duas execuções deixam de ser
# comparáveis, que é justamente o que uma linha de base precisa ser.
#
# O caminho que resolve a causa é uma chave própria do provedor (BYOK) em
# openrouter.ai/settings/integrations: ela tira as chamadas do pool compartilhado.
#
# 2026-08-10, decisão: **o pin sai**. Dois provedores fixados encheram em duas
# semanas (Together, depois Baidu), e o padrão é o que a lista acima já dizia sem
# ninguém tirar a conclusão: fixar um provedor converte a saturação DELE em parada
# total, porque `roteamento()` desliga o fallback junto. A linha de base passa a
# ser medida como um cliente mede — este arquivo é gerado por `orquestrador init`
# com a lista vazia, então roteamento livre é o que o cliente recebe, e é o que
# precisa ser bom.
#
# O que se perde está medido e é caro: 0% de cache sem pin contra 69% com ele. A
# entrada do mapeador e o custo vão subir. Registre os dois números da linha de
# base sem pin e compare com os do pin antes de decidir de novo — a escolha entre
# "barato e frágil" e "caro e estável" é de quem paga, e agora terá as duas
# medidas em vez de uma.
#
# **A lista vazia NÃO afrouxa a privacidade.** `retencao_de_dados = "deny"` é campo
# separado e continua viajando em toda chamada, então o roteador só considera
# provedor que não retém o conteúdo enviado — e o mapeador envia código-fonte do
# cliente. É o fallback que volta, não a política.
#
# 2026-08-11, decisão: **pin de volta, no GMICloud, por enquanto.** O período sem
# pin cumpriu o papel — mediu o mundo do cliente — e o veredito foi pior do que o
# esperado: a MESMA chamada variou de 40 tokens com erro a 18k de raciocínio
# conforme o provedor sorteado, uma espiral de 65.536 custou 12 minutos, e a
# variância entre execuções (±10 min) engoliu qualquer medição de arquitetura.
# GMICloud, e não Baidu ou BaseTen: o Baidu perdeu o desconto que o justificava
# (0,080 → 0,140/M) além de ter fechado o pool; o BaseTen é são (fp8, 100% de
# uptime) porém 14% mais caro que o GMICloud (0,112/0,224, fp8, 99,97%) — e o
# GMICloud é o único com validação empírica nossa: 7/7 chamadas saudáveis nos
# probes de 2026-08-11, na chamada exata que concentrava o problema. BaseTen é a
# reserva designada se ele degradar. **Cache medido em 2026-08-11 (3 amostras do
# Bloco 1): 57–61% do total, com a exploração lendo 144k–173k do cache por
# amostra — o GMICloud entrega o prefixo.** Mapeador fatiado: 6,1/3,5/4,6 min
# contra 10,6 do monolítico — o pin devolveu a consistência que a medição sem
# pin não tinha.
provedores_permitidos = ["gmicloud"]

# ---------------------------------------------------------------------------
# Modelos por estágio
# ---------------------------------------------------------------------------
# O mapeador tem o julgamento mais difícil e o menor volume de saída: recebe o
# modelo mais capaz. O executor tem o volume de tokens e trabalho mecânico se o
# gabarito for bom: aceita um modelo mais barato, porque o Gate B pega os erros
# de forma determinística.
#
# `modo_estruturado`: "prompt" (mais portátil), "json_schema", "json_object" ou
# "tools". Em qualquer modo a saída é validada por Pydantic aqui; se não validar,
# um delta de estágio "schema" é reenviado sozinho.

[estagios.mapeador]
modelo = "deepseek/deepseek-v4-flash-0731"
temperatura = 0.0
modo_estruturado = "prompt"
max_tentativas_schema = 3
limite_passos = 60
# As 3 fatias de serialização (manifesto, dossiê, schemas) rodam em paralelo — a
# exploração continua serial, é uma conversa só. Mesmo racional do planejador.
paralelismo = 3

# O planejador expande o gabarito em cenários concretos, um endpoint por chamada.
# É onde mora o julgamento que o executor não deve improvisar no meio da escrita.
#
# temperatura 0.6, e não 0.0: com a entrada enriquecida pelo dossiê, temp 0.0
# degenerou em espiral de raciocínio (medido 2026-08-10: 65.536 tokens, 100%
# pensamento, resposta nunca começada, no GET de listagem). Com 0.6 a mesma
# chamada completou com 39 cenários e 9,3 mil tokens de saída.
#
# raciocinio = false: o modelo é híbrido e o pensamento é desligável por chamada.
# Com o dossiê na entrada, planejar virou transcrição — as regras, códigos e
# defaults chegam decididos — e a fase de pensamento só oferecia a espiral
# (2026-08-10: ~1 chamada em 5-10 corria aos 65.536 tokens sem começar a
# resposta). O mapeador mantém o raciocínio: lá a deliberação é o trabalho.
[estagios.planejador]
modelo = "deepseek/deepseek-v4-flash-0731"
temperatura = 0.6
raciocinio = false
# Backstop contra loop de repetição no conteúdo (2026-08-10: sem raciocínio, uma
# chamada travou permutando o mesmo nome de cenário até os 65.536). As chamadas
# saudáveis ficam abaixo de 12k; um loop agora morre em ~2 min e o retry único
# do estágio rola o dado de novo.
max_tokens = 16000
# 3 chamadas simultâneas: as ~16 chamadas do estágio são independentes entre si,
# e em fila somavam ~4 min. Moderado (não 6+) por causa dos 429 da Together.
paralelismo = 3
modo_estruturado = "prompt"
max_tentativas_schema = 3

[estagios.executor]
modelo = "deepseek/deepseek-v4-flash-0731"
temperatura = 0.0
modo_estruturado = "prompt"
# As fatias de spec são independentes por construção — cada uma escreve um arquivo
# diferente — então correm juntas. Medido em 2026-08-11, serial: 16 chamadas
# somando 16,6 min, que era praticamente toda a execução.
#
# O `_support/` continua fora do paralelo, e não é só por ser pré-requisito dos
# specs: rodando sozinho e primeiro, ele aquece o cache do prefixo. As três fatias
# seguintes pegam a instrução fixa de 36 mil caracteres já cacheada, em vez de as
# três pagarem preço cheio pela mesma coisa.
#
# Se o provedor devolver 429 (tpm_rate_limit_exceeded), baixe para 2: a entrada por
# chamada aqui é maior que a do mapeador, que roda em 3 no mesmo pin sem bater teto.
paralelismo = 3
max_tentativas_schema = 3
# 120.000 de teto por resposta, contra os 65.536 que o provedor aplica quando
# ninguém pede nada. O modelo aceita até 131.072 nesta rota.
#
# Isto NÃO é o freio anti-loop que o planejador tem — é o contrário dele. Aqui o
# teto foi AUMENTADO para testar a hipótese de que a espiral medida em 2026-08-10
# (65.536 de saída, 100% pensamento, nenhum byte de resposta) foi falta de espaço
# para deliberar, e não deliberação degenerada. A evidência contrária está no
# planejador do mesmo dia: uma chamada espiralou aos 65.536 e a repetição, com
# entrada idêntica, fechou em 5.638 tokens — 4 mil deles de raciocínio. Se a
# hipótese não se confirmar, o custo do loop dobra junto com o teto, e o caminho
# passa a ser `raciocinio = false` como no planejador.
max_tokens = 120000
# 2026-08-10, medição em andamento: com o raciocínio ligado o estágio gastou
# 112.929 tokens de saída — 96% deles pensamento — e não escreveu um byte de
# código em 23 minutos. Desligado, o planejador saiu de 61 min para 4. O que
# antes desaconselhava fazer isto aqui (o executor devolveu `{"arquivos": []}`
# num teste antigo) mudou de contexto: ele agora recebe o plano com os cenários
# prontos, e a limpeza gerada passou a ser conferida por script (QAORQ-031/032/033),
# então "saiu ruim" virou reprovação de gate em vez de esperança.
raciocinio = false

[estagios.auditor]
modelo = "deepseek/deepseek-v4-flash-0731"
temperatura = 0.0
modo_estruturado = "prompt"

# ---------------------------------------------------------------------------
# Gates
# ---------------------------------------------------------------------------

[gates.a]
max_tentativas = 3

[gates.b]
max_tentativas = 3

# ---------------------------------------------------------------------------
# Execução
# ---------------------------------------------------------------------------

[execucao]
graphify = "graphify"
timeout_s = 600

# Prettier e ESLint do Gate B. Lista vazia desliga a etapa.
# Ligue apontando para o toolchain do projeto consumidor, por exemplo:
#   prettier = ["npx", "--no-install", "prettier", "--check"]
#   eslint   = ["npx", "--no-install", "eslint", "--format", "json"]
# O diretório do recurso é acrescentado como último argumento.
prettier = []
eslint = []
# Ferramenta configurada aqui e ausente do PATH:
#   true  interrompe a execução com erro de ferramenta;
#   false segue com o aviso QAORQ-022.
# Nem um nem outro reprova o artefato — instalar o toolchain do projeto não é
# trabalho que o executor consiga fazer reescrevendo teste.
exigir_formatadores = false

# Bloco 3. Só roda com --rodar-cypress.
#
# O comando PRECISA conter a marca {relatorio} no argumento que diz ao repórter
# onde escrever o JSON. O orquestrador a substitui pelo caminho do relatório desta
# execução (dentro de `saida`), garante que ele não existe antes de rodar e exige
# que exista depois. Sem isso não há como distinguir o relatório de agora do que
# uma execução anterior deixou no projeto — e relatório velho aprovando suíte nova
# é o falso sucesso mais silencioso que existe.
#
# Código de saída diferente de zero reprova o recurso; quando o Cypress não roda,
# o resumo diz NAO_EXECUTADO em vez de deixar a cobertura estática passar por prova.
#
#   cypress = ["npx", "--no-install", "cypress", "run",
#              "--reporter", "json", "--reporter-options", "output={relatorio}"]
# Escopado ao recurso em teste nesta bateria: o specPattern do projeto cobre
# todas as APIs, e a suíte de outro recurso reprovando viraria veredito do
# recurso errado. Parametrizar o --spec pelo recurso é melhoria pendente.
cypress = ["npx", "--no-install", "cypress", "run",
           "--spec", "cypress/e2e/apis/customers/*.cy.js",
           "--reporter", "json", "--reporter-options", "output={relatorio}"]

max_bytes_arquivo = 2000000
max_resultados_busca = 40

# Teto desta bateria de teste. 8 milhões de tokens por execução: folga de ~6x sobre
# a faixa estimada para o backend inteiro, e um freio contra laço em fuga.
[orcamento.por_execucao]
tokens = 8000000
